[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloxy"
dynamic = ["version"]
description = "Give your local AI eyes and memory — web proxy, self-maintaining conversation memory, MCP server, and an Apple Silicon LLM in one process."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["llm", "rag", "memory", "mcp", "mlx", "apple-silicon", "web-proxy", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.49.0",
    "httpx>=0.28.0",
    "trafilatura>=2.1.0",
    "markdownify>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.0",
    "numpy>=2.4.0",
    "aiosqlite>=0.22.0",
    "cachetools>=7.1.0",
    "mcp>=1.10",
]

[project.optional-dependencies]
# Apple Silicon local LLM backend (mlx-lm pulls mlx as a dependency).
mlx = ["mlx-lm>=0.31.0"]
dev = ["pytest>=8"]

[project.scripts]
cloxy = "cloxy.cli:main"

[project.urls]
Homepage = "https://github.com/roygurner-gif/cloxy"
Issues = "https://github.com/roygurner-gif/cloxy/issues"

[tool.setuptools.dynamic]
version = { attr = "cloxy.__version__" }

[tool.setuptools.packages.find]
include = ["cloxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
